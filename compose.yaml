name: dispatch

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dispatch-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    stop_grace_period: 15s

  dispatch-api:
    build:
      context: .
      target: dispatch-api
    environment:
      DATABASE_URL: postgres://workflow:workflow_dev@postgres:5432/workflow?sslmode=disable
      HTTP_ADDR: 0.0.0.0:5080
      LEASE_DURATION: ${LEASE_DURATION:-8s}
      RETRY_BASE: ${RETRY_BASE:-1s}
      RETRY_MAXIMUM: ${RETRY_MAXIMUM:-30s}
      RECOVERY_INTERVAL: ${RECOVERY_INTERVAL:-500ms}
      RECOVERY_BATCH_SIZE: ${RECOVERY_BATCH_SIZE:-100}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      DISPATCH_ENVIRONMENT: demo
      DISPATCH_VERSION: local
    ports:
      - "127.0.0.1:${DISPATCH_API_PORT:-5080}:5080"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 15s

  dispatch-demo:
    build:
      context: .
      target: dispatch-demo
    environment:
      DEMO_HTTP_ADDR: 0.0.0.0:5090
      DISPATCH_API_URL: http://dispatch-api:5080
      DEMO_SHUTDOWN_TIMEOUT: ${DEMO_SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:${DISPATCH_DEMO_PORT:-5090}:5090"
    depends_on:
      dispatch-api:
        condition: service_healthy
    init: true
    stop_grace_period: 15s

volumes:
  dispatch-postgres-data:
